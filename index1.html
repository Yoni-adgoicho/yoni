<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <title>סידור העבודה שלי - דרום נהגים</title>
  
  <link rel="icon" href="icon-192.svg">
  <link rel="apple-touch-icon" href="icon-192.svg">

  <style>
    :root {
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #059669;
      --rest: #94a3b8;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .hidden { display: none !important; }

    /* Login */
    #login-overlay {
      position: fixed; inset: 0; background: #0f172a; color: #fff;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999;
    }
    #login-box {
      background: #1e293b; padding: 2rem; border-radius: 20px; text-align: center;
      width: 88%; max-width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }
    #login-box h2 { margin-bottom: 8px; font-size: 1.35rem; }
    #login-box p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 18px; }
    #login-box input {
      width: 100%; padding: 14px; margin-bottom: 14px; border: 1px solid #334155;
      background: #0f172a; color: #fff; border-radius: 12px; font-size: 1.1rem;
      text-align: center; outline: none;
    }
    #login-box input:focus { border-color: var(--primary); }
    #login-box button {
      width: 100%; padding: 14px; background: var(--primary); color: #fff;
      border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    #error-msg { color: #f87171; display: none; margin-top: 12px; font-size: 0.9rem; }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #fff; padding: 18px 16px 20px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 8px 30px rgba(15,23,42,0.15);
      position: sticky; top: 0; z-index: 50;
    }
    header .inner { max-width: 720px; margin: 0 auto; }
    header h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 2px; }
    header .sub { font-size: 0.8rem; color: #bfdbfe; opacity: 0.9; }

    main { max-width: 720px; margin: 0 auto; padding: 16px 14px 40px; }

    /* Welcome / My Schedule card */
    .welcome-card {
      background: var(--card); border-radius: var(--radius); padding: 18px;
      box-shadow: var(--shadow); margin-bottom: 14px;
      display: flex; align-items: center; gap: 14px;
    }
    .welcome-icon { font-size: 2rem; }
    .welcome-card h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 2px; }
    .welcome-card p { font-size: 0.85rem; color: var(--muted); }

    /* Action buttons */
    .simple-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
    }
    .primary-action, .secondary-action {
      border: none; border-radius: 14px; padding: 15px 12px;
      font-size: 0.95rem; font-weight: 800; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .primary-action {
      background: var(--primary); color: #fff;
      box-shadow: 0 6px 18px rgba(37,99,235,0.3);
    }
    .secondary-action {
      background: var(--card); color: var(--primary-dark);
      border: 1.5px solid #bfdbfe;
    }
    .primary-action:active, .secondary-action:active { transform: scale(0.97); }

    /* Search panel */
    .hero-search {
      background: var(--card); border-radius: 20px; padding: 18px;
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .hero-search h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 4px; }
    .hero-search > p { font-size: 0.82rem; color: var(--muted); margin-bottom: 14px; }
    .search-main { position: relative; }
    .search-main input {
      width: 100%; height: 52px; border: 2px solid var(--border);
      border-radius: 14px; padding: 0 48px 0 16px; font-size: 1rem;
      outline: none; background: #f8fafc; transition: border 0.15s, box-shadow 0.15s;
    }
    .search-main input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
      background: #fff;
    }
    .search-icon {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      font-size: 1.2rem; color: var(--muted); pointer-events: none;
    }
    .search-tools {
      display: flex; gap: 10px; align-items: center; margin-top: 12px;
    }
    .clear-search {
      border: none; background: #f1f5f9; color: var(--muted);
      border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
    }

    /* Results */
    .result-meta {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .result-pill {
      font-size: 0.75rem; font-weight: 700; padding: 5px 11px; border-radius: 999px;
      background: #f1f5f9; color: #475569;
    }
    .result-pill.blue { background: var(--primary-soft); color: var(--primary-dark); }
    .result-pill.green { background: #ecfdf5; color: var(--success); }

    .empty-state {
      background: #f8fafc; border: 1.5px dashed #cbd5e1; border-radius: 16px;
      padding: 28px 16px; text-align: center; color: var(--muted); font-size: 0.95rem;
    }
    .empty-state small { display: block; margin-top: 8px; font-size: 0.8rem; }

    /* Worker result card */
    .schedule-result {
      background: var(--card); border-radius: 18px; margin-bottom: 12px;
      box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--border);
    }
    .schedule-result summary {
      list-style: none; cursor: pointer; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center;
      transition: background 0.15s;
    }
    .schedule-result summary::-webkit-details-marker { display: none; }
    .schedule-result summary:hover { background: #f8fafc; }
    .schedule-result[open] summary { background: #f8fafc; border-bottom: 1px solid var(--border); }
    .worker-head { display: flex; align-items: center; gap: 10px; }
    .worker-head b { font-size: 1rem; font-weight: 800; }
    .worker-code {
      font-size: 0.7rem; font-weight: 700; color: var(--primary-dark);
      background: var(--primary-soft); padding: 3px 9px; border-radius: 999px;
    }

    /* Day cards – When I Work style */
    .compact-week { padding: 8px 12px 14px; }
    .compact-day {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      padding: 12px 10px;
      border-radius: 14px;
      margin-bottom: 8px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      align-items: start;
    }
    .compact-day:last-child { margin-bottom: 0; }
    .compact-date {
      font-weight: 800; font-size: 0.85rem; color: var(--text);
      line-height: 1.3;
    }
    .compact-date small {
      display: block; font-weight: 600; font-size: 0.72rem; color: var(--muted); margin-top: 2px;
    }
    .compact-task {
      font-size: 0.88rem; color: #334155; line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .compact-hours {
      grid-column: 2;
      margin-top: 6px;
    }
    .time-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--primary-soft); color: var(--primary-dark);
      border-radius: 10px; padding: 5px 10px;
      font-weight: 800; font-size: 0.8rem; white-space: nowrap;
    }
    .rest-badge {
      background: #f1f5f9; color: var(--rest);
    }

    @media (max-width: 420px) {
      .simple-actions { grid-template-columns: 1fr; }
      .compact-day { grid-template-columns: 64px 1fr; }
    }
  </style>
</head>

    function normalizeText(v){
      return String(v??'').toLowerCase()
        .replace(/[־–—]/g,'-')
        .replace(/[״”“]/g,'"')
        .replace(/[׳’]/g,"'")
        .replace(/\s+/g,' ')
        .trim();
    }
    function searchKey(v){
      return normalizeText(v).replace(/[\s\-_/.,:()]+/g,'');
    }
    function escapeHtml(v){
      return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function formatHours(hours, task=''){
      const h=(hours||[]).filter(Boolean);
      if(!h.length) return task.includes('מנוחה') ? '<span class="time-badge rest-badge">😴 מנוחה</span>' : '<span class="time-badge">שעות לא צוינו</span>';
      if(h.length===2){
        const a=h[0], b=h[1];
        const am=a.split(':').map(Number), bm=b.split(':').map(Number);
        const amins=am[0]*60+am[1], bmins=bm[0]*60+bm[1];
        // For the common PDF formats: if the first time is later than the second,
        // treat it as an overnight shift; otherwise show chronological order.
        const overnight=amins>bmins && (amins>=18*60 || bmins<=8*60);
        const start=overnight?a:(amins<=bmins?a:b), end=overnight?b:(amins<=bmins?b:a);
        return `<span class="time-badge">🕐 ${escapeHtml(start)} → ${escapeHtml(end)}</span>`;
      }
      return `<span class="time-badge">🕐 ${h.map(escapeHtml).join(' • ')}</span>`;
    }
    function dayMatches(day, terms){
      if(!terms.length) return true;
      const text=normalizeText(`${day.date} ${day.day} ${day.task} ${(day.hours||[]).join(' ')}`);
      const key=searchKey(text);
      return terms.every(t=>text.includes(t) || key.includes(searchKey(t)));
    }
    function workerMatches(worker, terms){
      if(!terms.length) return true;
      const text=normalizeText(`${worker.name} ${worker.code}`);
      const key=searchKey(text);
      return terms.every(t=>text.includes(t) || key.includes(searchKey(t)));
    }
    function searchWorkSchedule(){
      const input=$('workScheduleSearch'), container=$('workScheduleResults');
      if(!input || !container) return;
      const raw=input.value.trim();
      if(!raw){
        container.innerHTML='<div class="empty-state">הקלד שם, קוד או מילה מהמשימה כדי להתחיל<small>אפשר גם לחפש "חמישי מונית" או "סבידור"</small></div>';
        return;
      }
      const terms=normalizeText(raw).split(/[\s,]+/).filter(Boolean);
      // A word that matches a worker name/code identifies the worker; remaining words
      // filter that worker's days. If no word identifies a worker, search all daily tasks.
      const identityTerms=terms.filter(t=>WORK_SCHEDULE.some(w=>workerMatches(w,[t])));
      let results=[];
      if(identityTerms.length){
        const workers=WORK_SCHEDULE.filter(w=>identityTerms.every(t=>workerMatches(w,[t])));
        const dayTerms=terms.filter(t=>!identityTerms.includes(t));
        results=workers.map(worker=>({
          worker,
          days: dayTerms.length ? worker.days.filter(d=>dayMatches(d,dayTerms)) : worker.days
        })).filter(r=>r.days.length);
      } else {
        WORK_SCHEDULE.forEach(worker=>{
          const days=worker.days.filter(d=>dayMatches(d,terms));
          if(days.length) results.push({worker,days});
        });
      }
      const totalDays=results.reduce((n,r)=>n+r.days.length,0);
      if(!results.length){
        container.innerHTML=`<div class="empty-state"><div style="font-size:28px;margin-bottom:8px">🔍</div><b>לא מצאתי תוצאה</b><br><small style="margin-top:6px;display:inline-block">נסה שם, קוד, יום או מילה מהמשימה</small></div>`;
        return;
      }
      const header=`<div class="result-meta"><span class="result-pill blue">👥 ${results.length} עובדים</span><span class="result-pill green">📅 ${totalDays} ימים</span></div>`;
      container.innerHTML=header+results.map(r=>`<details class="schedule-result" ${results.length===1?'open':''}>
        <summary>
          <div class="worker-head">
            <b>${escapeHtml(r.worker.name)}</b>
            <span class="worker-code">${escapeHtml(r.worker.code)}</span>
          </div>
        </summary>
        <div class="compact-week">
          ${r.days.map(d=>`
            <div class="compact-day">
              <div class="compact-date">${escapeHtml(d.day)}<small>${escapeHtml(d.date)}</small></div>
              <div>
                <div class="compact-task">${escapeHtml(d.task)}</div>
                <div class="compact-hours">${formatHours(d.hours,d.task)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </details>`).join('');
    }
    function setScheduleSearch(val){if($('workScheduleSearch')){$('workScheduleSearch').value=val;searchWorkSchedule()}}
    function clearWorkScheduleSearch(){if($('workScheduleSearch')){$('workScheduleSearch').value='';searchWorkSchedule()}}
    function focusMyShifts(){setScheduleSearch(MY_NAME)}
    function scrollToSection(id,btn){document.querySelectorAll('.app-nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');$(id)?.scrollIntoView({behavior:'smooth'})}
